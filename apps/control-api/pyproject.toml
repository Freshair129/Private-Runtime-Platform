[project]
name = "prp-control"
version = "0.4.0a0"
description = "PRP control plane: thin Python API, policy, ports and adapters (ADR-PRP-009/011, SDD-PRP-REPO §6). No model, CUDA or ML dependency may ever enter this project (PRP-NFR-021)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "types-pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.11,<2",
    "import-linter>=2,<3",
]

[project.scripts]
prp-api = "prp.entrypoints.api:main"
prp-dispatcher = "prp.entrypoints.dispatcher:main"
prp-observer = "prp.entrypoints.observer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Generated contract models keep the contract's own descriptions verbatim (ADR-PRP-013 rule 3).
"src/prp/contracts/*_v1.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "req(id): PRP requirement ID this test provides evidence for (SDD-PRP-REPO §9)",
    "at(id): PRP acceptance specification ID this test is collected under; status stays NOT_RUN until a receipt exists",
    "integration: needs real services; a skipped integration test is not a pass",
    "hardware: needs a physical GPU or voice device; never runs in cloud CI",
]

[tool.importlinter]
root_package = "prp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (SDD-PRP-REPO 6.3): entrypoints -> api | adapters -> contracts -> core -> platform"
type = "layers"
layers = [
    "prp.entrypoints",
    "prp.api | prp.adapters",
    "prp.contracts",
    "prp.core",
    "prp.platform",
]

[[tool.importlinter.contracts]]
name = "generated contract models depend on Pydantic only (ADR-PRP-013)"
type = "forbidden"
source_modules = ["prp.contracts"]
forbidden_modules = ["prp.core", "prp.platform", "prp.api", "prp.adapters", "prp.entrypoints", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core and platform are pure Python: no web framework, ORM, HTTP client or vendor SDK"
type = "forbidden"
source_modules = ["prp.core", "prp.platform"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "uvicorn",
    "httpx",
    "sqlalchemy",
    "psycopg",
    "asyncpg",
]

[[tool.importlinter.contracts]]
name = "control plane never imports ML runtimes or weights loaders (PRP-NFR-021, Coding-Standards 4)"
type = "forbidden"
source_modules = ["prp"]
forbidden_modules = [
    "torch",
    "torchaudio",
    "tensorflow",
    "jax",
    "transformers",
    "vllm",
    "whisper",
    "faster_whisper",
    "ctranslate2",
    "TTS",
    "onnxruntime",
    "xinference",
    "ray",
]

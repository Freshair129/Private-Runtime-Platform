<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
<title id="title">D04 — Two-site private deployment</title>
<desc id="desc">Approved logical design: client ingress terminates at the Site A gateway. Control-to-worker traffic for Site B crosses a default-deny inter-site boundary only after N0-NET. Site B LLM and optional speech worker flows are allowlisted independently. No public worker, admin, metrics, filesystem, SMB or SSH access.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6f81"/></marker>
  <marker id="arrow-dash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8796a3"/></marker>
  <style>
    text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#263746}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#536779}
    .boundary{fill:#fff;stroke:#b7c6d1;stroke-width:2}.siteTitle{font-size:16px;font-weight:700;fill:#344b5e}
    .box{stroke:#536779;stroke-width:1.5;rx:12;ry:12}.normal{fill:#e9f3f8}.worker{fill:#e5f3ed}.state{fill:#fff4db}.client{fill:#f0f1f3}.risk{fill:#fce8e6}
    .label{font-size:14px;font-weight:600}.small{font-size:12px}.tiny{font-size:11px}.edge{fill:none;stroke:#5b6f81;stroke-width:2;marker-end:url(#arrow)}
    .opsEdge{fill:none;stroke:#8796a3;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-dash)}.assoc{fill:none;stroke:#b34c43;stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
  </style>
</defs>
<rect width="1700" height="900" fill="#fff"/>
<text class="title" x="40" y="42">D04 — Two-site private deployment</text>
<text class="subtitle" x="40" y="68">Approved logical view only · route, endpoints and ports are not established by this diagram</text>
<!-- trust boundaries -->
<rect class="boundary" x="260" y="100" width="440" height="550" rx="18"/>
<text class="siteTitle" x="480" y="130" text-anchor="middle">SITE A · CONTROL PLACEMENT IS AN SPOF</text>
<rect class="boundary" x="740" y="205" width="340" height="285" rx="18" style="stroke:#c9b77a"/>
<text class="siteTitle" x="910" y="235" text-anchor="middle" style="fill:#614d20">INTER-SITE BOUNDARY · N0-NET</text>
<rect class="boundary" x="1210" y="100" width="440" height="550" rx="18"/>
<text class="siteTitle" x="1430" y="130" text-anchor="middle">SITE B · SEPARATE TRUST BOUNDARY</text>
<rect class="boundary" x="300" y="700" width="500" height="120" rx="18"/>
<text class="siteTitle" x="550" y="728" text-anchor="middle">OPERATIONS</text>
<!-- flows; route into Site B is explicit through the inter-site boundary -->
<path class="edge" d="M205 220 L320 190"/>
<path class="edge" d="M410 225 L410 292"/>
<path class="edge" d="M550 341 L590 341"/>
<path class="edge" d="M435 390 L435 480"/>
<path class="edge" d="M550 344 L790 344"/>
<path class="edge" d="M1030 320 L1290 250"/>
<path class="edge" d="M1030 380 L1290 435"/>
<path class="edge" d="M215 500 L245 500 L245 190 L320 190"/>
<path class="opsEdge" d="M520 740 L520 670 L435 670 L435 575"/>
<path class="opsEdge" d="M700 740 L910 740 L910 430"/>
<path class="assoc" d="M1340 710 L1280 670 L1190 620 L1120 540 L1030 430"/>
<text class="small" x="216" y="282">Client ingress · gateway only</text>
<text class="small" x="565" y="330">Only after N0-NET</text>
<text class="small" x="1080" y="275">Bound allowlisted LLM flow</text>
<text class="small" x="1080" y="422">Speech only if allowlisted</text>
<text class="small" x="55" y="575">Separate, provisioned webhook ingress</text>
<text class="small" x="440" y="657">Separate reviewed ops flow</text>
<text class="small" x="745" y="727">Reviewed ops flow</text>
<!-- nodes -->
<rect class="box client" x="30" y="180" width="175" height="80"/>
<text class="label" x="117" y="211" text-anchor="middle">Approved PRP</text><text class="small" x="117" y="233" text-anchor="middle">clients</text>
<rect class="box client" x="30" y="455" width="185" height="90"/>
<text class="label" x="122" y="490" text-anchor="middle">Optional LINE</text><text class="small" x="122" y="513" text-anchor="middle">Public webhook</text><text class="tiny" x="122" y="532" text-anchor="middle">Policy-limited media</text>
<rect class="box normal" x="320" y="150" width="215" height="75"/>
<text class="label" x="427" y="180" text-anchor="middle">Private TLS ingress</text><text class="small" x="427" y="202" text-anchor="middle">Gateway only</text>
<rect class="box normal" x="320" y="292" width="230" height="98"/>
<text class="label" x="435" y="326" text-anchor="middle">Thin Python control</text><text class="small" x="435" y="350" text-anchor="middle">No model weights / no CUDA</text>
<rect class="box state" x="590" y="295" width="95" height="95" rx="18" ry="18"/>
<text class="label" x="637" y="326" text-anchor="middle">PRP DB</text><text class="small" x="637" y="347" text-anchor="middle">+ storage</text><text class="small" x="637" y="368" text-anchor="middle">SPOF</text>
<rect class="box worker" x="330" y="480" width="210" height="95"/>
<text class="label" x="435" y="516" text-anchor="middle">vLLM A</text><text class="small" x="435" y="540" text-anchor="middle">12 GB nominal GPU</text>
<rect class="box state" x="790" y="275" width="240" height="155"/>
<text class="label" x="910" y="306" text-anchor="middle">Private routed path</text><text class="small" x="910" y="332" text-anchor="middle">Default deny</text><text class="small" x="910" y="354" text-anchor="middle">Reviewed flows only</text><text class="small" x="910" y="376" text-anchor="middle">TLS + service identity</text><text class="tiny" x="910" y="404" text-anchor="middle">Route / ports TBD</text>
<rect class="box worker" x="1290" y="205" width="250" height="90"/>
<text class="label" x="1415" y="242" text-anchor="middle">vLLM B</text><text class="small" x="1415" y="266" text-anchor="middle">16 GB nominal GPU</text>
<rect class="box worker" x="1290" y="390" width="250" height="95"/>
<text class="label" x="1415" y="427" text-anchor="middle">Isolated speech service</text><text class="small" x="1415" y="451" text-anchor="middle">Optional · only if allowlisted</text>
<rect class="box normal" x="465" y="740" width="170" height="55"/>
<text class="label" x="550" y="774" text-anchor="middle">Private observer</text>
<rect class="box risk" x="1090" y="710" width="560" height="112" rx="4" ry="4"/>
<text class="label" x="1115" y="742">No public worker / admin / metrics / filesystem / SMB / SSH</text><text class="small" x="1115" y="770">Route, identity or boundary change, loss or revocation invalidates</text><text class="small" x="1115" y="792">qualification and blocks dispatch until review and re-test.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="835" viewBox="0 0 1120 835"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#405C70"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="14.0" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="105.0" y1="76" x2="105.0" y2="807" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="105.0" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">LINE Platform</text><rect x="241.5" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="332.5" y1="76" x2="332.5" y2="807" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="332.5" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">External adapter</text><rect x="469.0" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="560.0" y1="76" x2="560.0" y2="807" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="560.0" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">PRP</text><rect x="696.5" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="787.5" y1="76" x2="787.5" y2="807" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="787.5" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">Artifact access</text><rect x="924.0" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="1015.0" y1="76" x2="1015.0" y2="807" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="1015.0" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">LINE user</text><line x1="105.0" y1="129" x2="332.5" y2="129" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="218.75" y="105" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Webhook event / raw signature</text><rect x="16" y="156" width="1088" height="53" rx="5" fill="#FFF4DB" stroke="#D3B56A"/><text x="32" y="175" font-family="DejaVu Sans" font-size="14" fill="#614D20">Adapter verifies, deduplicates and commits ingress before HTTP 200; DB failure is not acknowledged as</text><text x="32" y="193" font-family="DejaVu Sans" font-size="14" fill="#614D20">success</text><line x1="332.5" y1="265" x2="105.0" y2="265" stroke="#405C70" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="218.75" y="223" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">200 webhook + optional reply</text><text x="218.75" y="241" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">ACK</text><line x1="332.5" y1="308" x2="105.0" y2="308" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="218.75" y="284" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Get authorized audio content</text><line x1="332.5" y1="383" x2="560.0" y2="383" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="446.25" y="341" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">ASR -&gt; client context -&gt; chat</text><text x="446.25" y="359" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">-&gt; TTS</text><line x1="560.0" y1="426" x2="332.5" y2="426" stroke="#405C70" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="446.25" y="402" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Text + artifact references</text><line x1="332.5" y1="483" x2="787.5" y2="483" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="560.0" y="459" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Mint policy-approved audio grant</text><line x1="787.5" y1="540" x2="332.5" y2="540" stroke="#405C70" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="560.0" y="516" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">HTTPS URL / bounded TTL</text><line x1="332.5" y1="615" x2="105.0" y2="615" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="218.75" y="573" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Push with first-request retry</text><text x="218.75" y="591" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">key</text><line x1="105.0" y1="658" x2="1015.0" y2="658" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="560.0" y="634" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Deliver message / fetch media</text><rect x="16" y="685" width="1088" height="53" rx="5" fill="#FFF4DB" stroke="#D3B56A"/><text x="32" y="704" font-family="DejaVu Sans" font-size="14" fill="#614D20">ACK consumed reply token. Push policy/quota required. Unknown send is reconciled; no new inference to</text><text x="32" y="722" font-family="DejaVu Sans" font-size="14" fill="#614D20">repair delivery</text></svg>
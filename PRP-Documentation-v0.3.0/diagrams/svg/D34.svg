<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1107" viewBox="0 0 1120 1107"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#405C70"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="14.0" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="105.0" y1="76" x2="105.0" y2="1079" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="105.0" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">Operator</text><rect x="241.5" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="332.5" y1="76" x2="332.5" y2="1079" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="332.5" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">PRP control</text><text x="332.5" y="61" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">Python adapter</text><rect x="469.0" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="560.0" y1="76" x2="560.0" y2="1079" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="560.0" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">Selected runtime</text><text x="560.0" y="61" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">manager</text><rect x="696.5" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="787.5" y1="76" x2="787.5" y2="1079" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="787.5" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">Bound runtime</text><text x="787.5" y="61" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">A or B</text><rect x="924.0" y="18" width="182" height="58" rx="8" fill="#E9F3F8" stroke="#536779"/><line x1="1015.0" y1="76" x2="1015.0" y2="1079" stroke="#97AAB8" stroke-dasharray="6 5"/><text x="1015.0" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">PRP state</text><text x="1015.0" y="61" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#17364A">and evidence</text><line x1="105.0" y1="147" x2="332.5" y2="147" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="218.75" y="105" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Request approved</text><text x="218.75" y="123" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">lifecycle/profile change</text><line x1="332.5" y1="190" x2="1015.0" y2="190" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="673.75" y="166" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Persist intent, expected config epoch and authorization</text><line x1="332.5" y1="283" x2="560.0" y2="283" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="446.25" y="223" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Delegate supported</text><text x="446.25" y="241" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">launch/list action; no</text><text x="446.25" y="259" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">arbitrary model path</text><line x1="560.0" y1="344" x2="787.5" y2="344" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="673.75" y="302" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Start the approved full-model</text><text x="673.75" y="320" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">replica</text><line x1="560.0" y1="405" x2="332.5" y2="405" stroke="#405C70" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="446.25" y="363" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Return manager UID and</text><text x="446.25" y="381" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">deployment binding</text><line x1="332.5" y1="448" x2="787.5" y2="448" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="560.0" y="424" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Verify protected auth, profile and actual resource identity</text><line x1="332.5" y1="505" x2="1015.0" y2="505" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="673.75" y="481" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Save qualification + residency; only now mark ready</text><rect x="16" y="532" width="1088" height="49" rx="5" fill="#FFF4DB" stroke="#D3B56A"/><text x="32" y="551" font-family="DejaVu Sans" font-size="14" fill="#614D20">Invocation dispatch requires a matching committed lease. Opaque internal routing fails the binding gate.</text><line x1="332.5" y1="619" x2="787.5" y2="619" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="560.0" y="595" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Send one attempt to the proven target; preserve deadline</text><rect x="16" y="646" width="1088" height="49" rx="5" fill="#FFF4DB" stroke="#D3B56A"/><text x="32" y="665" font-family="DejaVu Sans" font-size="14" fill="#614D20">Manager relocation, unobserved retry or unknown termination: fence result and quarantine capacity.</text><line x1="332.5" y1="733" x2="1015.0" y2="733" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="673.75" y="709" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Settle once with matching runtime epoch or retain UNKNOWN</text><line x1="105.0" y1="808" x2="332.5" y2="808" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="218.75" y="766" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Drain/unload through same</text><text x="218.75" y="784" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">lifecycle owner</text><line x1="332.5" y1="887" x2="560.0" y2="887" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="446.25" y="827" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Terminate only when</text><text x="446.25" y="845" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">authorized and existing work</text><text x="446.25" y="863" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">reconciled</text><line x1="560.0" y1="948" x2="332.5" y2="948" stroke="#405C70" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="446.25" y="906" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Report actual termination</text><text x="446.25" y="924" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">evidence, not merely timeout</text><line x1="332.5" y1="991" x2="1015.0" y2="991" stroke="#405C70" stroke-width="1.4"  marker-end="url(#arr)"/><text x="673.75" y="967" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#17364A">Release residency only after verified stop</text></svg>
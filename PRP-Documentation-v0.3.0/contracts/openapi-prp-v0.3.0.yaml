openapi: 3.1.0
info:
  title: PRP - Private Runtime Platform
  version: 0.3.0
  description: DRAFT client API contract. Not implemented/tested by this document
    delivery. No mandatory Zuri/LINE dependency. Native P1 jobs are atomic ASR/TTS;
    apps own voice-turn orchestration. Keys/scopes required on all routes. Limits
    also depend on qualified profile.
servers:
- url: https://prp.example.invalid
  description: Documentation placeholder; replace with approved private ingress
security:
- ClientKey: []
paths:
  /v1/models:
    get:
      operationId: listModels
      summary: List granted model aliases
      responses:
        '200':
          description: Success
          headers: &id001
            X-Request-ID:
              description: Server-assigned correlation identifier
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401': &id002
          description: Invalid or expired credential
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Policy or scope denied
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id004
          description: Unavailable, no cloud fallback
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /prp/v1/capabilities:
    get:
      operationId: listCapabilities
      summary: List qualified and granted capabilities
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
                required:
                - data
                additionalProperties: false
        '401': *id002
        '403': *id003
        '503': *id004
  /v1/chat/completions:
    post:
      operationId: chatCompletion
      summary: Text chat; compatible subset only
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
            text/event-stream:
              schema:
                type: string
              description: Compatible data chunks. On success [DONE]; terminal event:error
                on failure, never resume partial stream on another node.
        '400': &id005
          description: Invalid or unsupported request
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
        '404': &id006
          description: Not found or not authorized to know
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id007
          description: Idempotency/version conflict
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &id008
          description: Audio too large
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415': &id009
          description: Unsupported media
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id010
          description: Semantic/context/no-speech/async-required error
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id011
          description: Quota/queue limit
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id004
        '504': &id012
          description: Deadline; execution may be unknown
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
  /v1/audio/transcriptions:
    post:
      operationId: transcribeAudio
      summary: Bounded synchronous ASR
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '400': *id005
        '401': *id002
        '403': *id003
        '404': *id006
        '409': *id007
        '413': *id008
        '415': *id009
        '422': *id010
        '429': *id011
        '503': *id004
        '504': *id012
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                language:
                  type: string
                  enum:
                  - th
                  - en
                  - auto
              required:
              - file
              - model
              additionalProperties: false
  /v1/audio/speech:
    post:
      operationId: synthesizeSpeech
      summary: Bounded approved-preset TTS
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400': *id005
        '401': *id002
        '403': *id003
        '404': *id006
        '409': *id007
        '413': *id008
        '415': *id009
        '422': *id010
        '429': *id011
        '503': *id004
        '504': *id012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
  /prp/v1/artifacts:
    post:
      operationId: uploadArtifact
      summary: Upload bounded audio; no remote URL
      responses:
        '201':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400': *id005
        '401': *id002
        '403': *id003
        '404': *id006
        '409': *id007
        '413': *id008
        '415': *id009
        '422': *id010
        '429': *id011
        '503': *id004
        '504': *id012
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
  /prp/v1/jobs:
    post:
      operationId: createJob
      summary: Durable native ASR or TTS job only
      responses:
        '202':
          description: Durably accepted or same pending logical job
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400': *id005
        '401': *id002
        '403': *id003
        '404': *id006
        '409': *id007
        '413': *id008
        '415': *id009
        '422': *id010
        '429': *id011
        '503': *id004
        '504': *id012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Scoped to org + principal + route + canonical payload. Same payload
          returns same job.
    get:
      operationId: listJobs
      summary: Paginated authorized jobs
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401': *id002
        '403': *id003
        '503': *id004
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
  /prp/v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Get scoped job outcome and execution state
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': *id002
        '403': *id003
        '404': *id006
        '503': *id004
      parameters:
      - &id013
        name: id
        in: path
        required: true
        schema: &id014
          type: string
          format: uuid
  /prp/v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Request cancellation; not proof of compute stopped
      responses:
        '202':
          description: Cancellation requested
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '200':
          description: Already terminal or queued cancellation completed
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': *id002
        '403': *id003
        '404': *id006
        '409': *id007
        '503': *id004
      parameters:
      - *id013
  /prp/v1/artifacts/{id}:
    get:
      operationId: readArtifact
      summary: Authenticated content read
      responses:
        '200':
          description: Authorized audio bytes
          headers: *id001
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/webm:
              schema:
                type: string
                format: binary
        '401': *id002
        '403': *id003
        '404': *id006
        '503': *id004
      parameters:
      - *id013
    delete:
      operationId: deleteArtifact
      summary: Tombstone artifact and block grants/late output
      responses:
        '204':
          description: Deletion accepted; content blocked
        '401': *id002
        '403': *id003
        '404': *id006
        '503': *id004
      parameters:
      - *id013
  /prp/v1/artifacts/{id}/grants:
    post:
      operationId: createArtifactGrant
      summary: Explicitly authorized revocable bearer-link access
      responses:
        '201':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '401': *id002
        '403': *id003
        '404': *id006
        '422': *id010
        '503': *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      parameters:
      - *id013
  /prp/v1/grants/{id}:
    delete:
      operationId: revokeGrant
      summary: Revoke artifact bearer grant
      responses:
        '204':
          description: Grant revoked
        '401': *id002
        '403': *id003
        '404': *id006
        '503': *id004
      parameters:
      - *id013
components:
  securitySchemes:
    ClientKey:
      type: http
      scheme: bearer
      description: PRP-scoped human or application key. Inference credentials never
        grant administrative rights.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            type:
              type: string
            message:
              type: string
            param:
              type:
              - string
              - 'null'
          required:
          - code
          - type
          - message
          additionalProperties: false
        request_id:
          type: string
        safe_to_retry:
          type: boolean
      required:
      - error
      - request_id
      - safe_to_retry
      additionalProperties: false
    Model:
      type: object
      properties:
        id:
          type: string
        object:
          const: model
        created:
          type: integer
        owned_by:
          type: string
      required:
      - id
      - object
      additionalProperties: false
    ModelList:
      type: object
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required:
      - object
      - data
      additionalProperties: false
    Capability:
      type: object
      properties:
        model:
          type: string
        profile_revision:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum:
            - chat
            - asr
            - tts
            - tool_calls
        languages:
          type: array
          items:
            type: string
        formats:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            max_context_tokens:
              type: integer
            max_audio_seconds:
              type: number
            max_input_bytes:
              type: integer
            max_tts_codepoints:
              type: integer
          required: []
          additionalProperties: false
        status:
          type: string
          enum:
          - ready
          - unavailable
      required:
      - model
      - profile_revision
      - capabilities
      - status
      additionalProperties: false
    Tool:
      type: object
      properties:
        type:
          const: function
        function:
          type: object
          properties:
            name:
              type: string
              maxLength: 64
            description:
              type: string
            parameters:
              type: object
            strict:
              type: boolean
          required:
          - name
          additionalProperties: false
      required:
      - type
      - function
      additionalProperties: false
    ToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
          required:
          - name
          - arguments
          additionalProperties: false
      required:
      - id
      - type
      - function
      additionalProperties: false
    Message:
      type: object
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type:
          - string
          - 'null'
        tool_call_id:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
      required:
      - role
      - content
      additionalProperties: false
    ChatRequest:
      type: object
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          minItems: 1
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        max_tokens:
          type: integer
          minimum: 1
          maximum: 8192
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
          oneOf:
          - type: string
            enum:
            - auto
            - none
            - required
          - type: object
            properties:
              type:
                const: function
              function:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
                additionalProperties: false
            required:
            - type
            - function
            additionalProperties: false
        n:
          type: integer
          const: 1
      required:
      - model
      - messages
      additionalProperties: false
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
      additionalProperties: false
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        object:
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/Message'
              finish_reason:
                type: string
                enum:
                - stop
                - length
                - tool_calls
            required:
            - index
            - message
            - finish_reason
            additionalProperties: false
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - id
      - object
      - created
      - model
      - choices
      additionalProperties: false
    Segment:
      type: object
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
        text:
          type: string
      required:
      - start
      - end
      - text
      additionalProperties: false
    Transcript:
      type: object
      properties:
        text:
          type: string
        language:
          type: string
        duration_seconds:
          type: number
          minimum: 0
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        profile_revision:
          type: string
      required:
      - text
      - language
      - duration_seconds
      - profile_revision
      additionalProperties: false
    SpeechRequest:
      type: object
      properties:
        model:
          type: string
        input:
          type: string
          minLength: 1
          maxLength: 800
        voice:
          type: string
        response_format:
          type: string
          enum:
          - wav
          - mp3
        speed:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
      required:
      - model
      - input
      - voice
      - response_format
      additionalProperties: false
    Artifact:
      type: object
      properties:
        artifact_id: *id014
        mime_type:
          type: string
        duration_seconds:
          type: number
          minimum: 0
        checksum_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        expires_at: &id015
          type: string
          format: date-time
      required:
      - artifact_id
      - mime_type
      - duration_seconds
      - expires_at
      additionalProperties: false
    AsrJobRequest:
      type: object
      properties:
        kind:
          const: asr
        model:
          type: string
        input_artifact_id: *id014
        language:
          type: string
          enum:
          - th
          - en
          - auto
        deadline_seconds:
          type: integer
          minimum: 1
          maximum: 180
          default: 180
        external_reference:
          type: string
          maxLength: 128
      required:
      - kind
      - model
      - input_artifact_id
      additionalProperties: false
    TtsJobRequest:
      type: object
      properties:
        kind:
          const: tts
        model:
          type: string
        input:
          type: string
          minLength: 1
          maxLength: 800
        voice:
          type: string
        response_format:
          type: string
          enum:
          - wav
          - mp3
        deadline_seconds:
          type: integer
          minimum: 1
          maximum: 180
          default: 180
        external_reference:
          type: string
          maxLength: 128
      required:
      - kind
      - model
      - input
      - voice
      - response_format
      additionalProperties: false
    JobRequest:
      oneOf:
      - $ref: '#/components/schemas/AsrJobRequest'
      - $ref: '#/components/schemas/TtsJobRequest'
      discriminator:
        propertyName: kind
        mapping:
          asr: '#/components/schemas/AsrJobRequest'
          tts: '#/components/schemas/TtsJobRequest'
    Job:
      type: object
      properties:
        job_id: *id014
        request_id:
          type: string
        kind:
          type: string
          enum:
          - asr
          - tts
        outcome:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - TIMED_OUT
          - CANCELLED
        execution_status:
          type: string
          enum:
          - QUEUED
          - RESERVED
          - DISPATCHED
          - RUNNING
          - UNKNOWN
          - FINISHED
        cancellation_requested:
          type: boolean
        status_path:
          type: string
        created_at: *id015
        deadline_at: *id015
        result:
          oneOf:
          - $ref: '#/components/schemas/Transcript'
          - type: object
            properties:
              artifact_id: *id014
            required:
            - artifact_id
            additionalProperties: false
        error:
          $ref: '#/components/schemas/Error'
        usage_provenance:
          type: string
          enum:
          - actual
          - estimated
          - unavailable
      required:
      - job_id
      - request_id
      - kind
      - outcome
      - execution_status
      - cancellation_requested
      - status_path
      - created_at
      - deadline_at
      additionalProperties: false
    JobList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - data
      - next_cursor
      additionalProperties: false
    GrantRequest:
      type: object
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 86400
      required:
      - ttl_seconds
      additionalProperties: false
    Grant:
      type: object
      properties:
        grant_id: *id014
        url:
          type: string
          format: uri
          pattern: ^https://
        expires_at: *id015
      required:
      - grant_id
      - url
      - expires_at
      additionalProperties: false

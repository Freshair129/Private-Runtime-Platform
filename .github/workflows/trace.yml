name: Trace

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "workers/**"
      - "docs/TEST-PRP.md"
      - "docs/registry/**"
      - "docs/evidence/**"
      - "tools/trace/**"
      - "tools/docs/validate_docs.py"
      - ".github/workflows/trace.yml"
  pull_request:
    paths:
      - "apps/**"
      - "workers/**"
      - "docs/TEST-PRP.md"
      - "docs/registry/**"
      - "docs/evidence/**"
      - "tools/trace/**"
      - "tools/docs/validate_docs.py"
      - ".github/workflows/trace.yml"
  workflow_dispatch:

jobs:
  trace:
    name: Markers -> code-trace.json -> acceptance status gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Sync every Python project in its own locked environment
        run: |
          for pyproject in apps/*/pyproject.toml workers/*/pyproject.toml; do
            project="$(dirname "$pyproject")"
            echo "== $project"
            (cd "$project" && uv python install && uv sync --locked --group dev)
          done

      - name: code-trace.json is current and every marker resolves
        run: python tools/trace/collect_trace.py --check

      - name: Acceptance status gate (test + receipt required to leave NOT_RUN)
        run: python tools/docs/validate_docs.py

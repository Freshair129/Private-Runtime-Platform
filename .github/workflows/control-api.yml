name: Control API

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/control-api/**"
      - "contracts/openapi/prp-client.*"
      - ".github/workflows/control-api.yml"
  pull_request:
    paths:
      - "apps/control-api/**"
      - "contracts/openapi/prp-client.*"
      - ".github/workflows/control-api.yml"
  workflow_dispatch:

jobs:
  gates:
    name: Coding-Standards 10 gates (no-ML control plane)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "apps/control-api/uv.lock"

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Type check (strict)
        run: uv run --locked mypy --strict src/prp

      - name: Import rules (layers, no framework in core, no ML anywhere)
        run: uv run --locked lint-imports

      - name: Unit and contract tests (report collected/executed/skipped)
        run: uv run --locked pytest tests/unit tests/contracts -ra -q
